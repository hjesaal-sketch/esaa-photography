    <div class="contact-info">
        <div class="contact-item">
            <span class="icon">📧</span>
            <h4>Email</h4>
            <p><a href="mailto:henry@esaaphotography.com">henry@esaaphotography.com</a></p>
        </div>

        <div class="contact-item">
            <span class="icon">📱</span>
            <h4>Teléfono</h4>
            <p><a href="tel:+584144619756">+58 414 461 9756</a></p>
        </div>

        <div class="contact-item">
            <span class="icon">📍</span>
            <h4>Ubicación</h4>
            <p>Venezuela</p>
        </div>

        <div class="contact-item">

    <!-- ===== FORMULARIO ===== -->
    <form class="contact-form" action="#" method="POST">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required />

        <label for="message">Mensaje</label>
        <textarea id="message" name="message" placeholder="Cuéntame sobre tu proyecto..." required></textarea>

        <button type="submit" class="btn-submit">Enviar mensaje</button>
    </form>
</section>
